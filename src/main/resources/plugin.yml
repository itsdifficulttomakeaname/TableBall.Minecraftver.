name: TableBall
version: 1.0.0
main: org.tableBall.TableBall
api-version: 1.20
depend: [Multiverse-Core]

commands:
  inviteplayer:
    description: 邀请玩家到指定世界开始游戏
    aliases: [ip]
    usage: /inviteplayer <玩家> <世界> <类型> <对局数>
    permission: tableball.invite
  leave:
    description: 离开当前游戏并返回大厅
    usage: /leave
  acceptinvite:
    description: 接受指定玩家的TableBall游戏邀请
    usage: /acceptinvite <玩家名>
    permission: tableball.invite
  editmode:
    description: 切换编辑模式
    usage: /editmode <enable/disable/info>
    permission: tableball.editmode
  spectategame:
    description: 观战
    usage: /spectategame
  quickmenu:
    description: 打开台球快捷菜单
    usage: /quickmenu
    aliases: [qm]
  teleporttowhiteball:
    description: 在游戏中快速传送到母球旁
    usage: /teleporttowhiteball
    permission: tableball.teleporttowhiteball
    aliases: [tpwb]

permissions:
  tableball.invite:
    description: 允许使用/inviteplayer命令
    default: true
  tableball.leave:
    description: 允许使用/leave命令
    default: true
  tableball.teleporttowhiteball:
    description: 允许玩家使用/teleporttowhiteball指令
    default: true
  tableball.admin:
    description: 给予所有TableBall权限
    default: op
    children:
      tableball.invite: true
      tableball.leave: true
      tableball.debug: true
